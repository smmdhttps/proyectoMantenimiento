<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/vehiculos-list"></ion-back-button>
    </ion-buttons>
    <ion-title>Historial de Mantenimiento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

@if (mostrarFormulario) {

<ion-list>
    <ion-item>
      <ion-input label="Kilometraje Actual" type="number" [(ngModel)]="kilometraje" placeholder="Ej: 12530"></ion-input>
    </ion-item>
</ion-list>

  <ion-list>
@for (tipos of tiposDefecto; track $index; let i = $index) {
    
  <ion-item>
    <ion-checkbox justify="start" (ionChange)="toggleTipo(i, $event.detail.checked)">
      {{ tipos }}
    </ion-checkbox>
  </ion-item>

}
<ion-button (click)="guardar()">ENVIAR</ion-button> 
<ion-button (click)="cancelar()">CANCELAR</ion-button>

  </ion-list>

}

  <ion-list class="ion-padding-top" lines="none">
    @for (registro of historial; track registro.id) {
      <app-registro-item
        [registro]="registro"
        [nombresTipos]="nombresDeTipos(registro.tiposMantenimientoIds)"
        (eliminar)="eliminarRegistro($event)">
      </app-registro-item>
    } @empty {
      <div class="empty-state">
        <ion-icon name="build-outline"></ion-icon>
        <h2>Sin registros aún</h2>
        <p>Toca "+" para agregar el primer mantenimiento.</p>
      </div>
    }
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="toggleFormulario()">
      <ion-icon [name]="mostrarFormulario ? 'close' : 'add'"></ion-icon>
    </ion-fab-button>
  </ion-fab>


</ion-content>
