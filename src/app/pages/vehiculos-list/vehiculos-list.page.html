<ion-header>
  <ion-toolbar>
    <ion-title>Mis Vehículos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    @for (vehiculo of misVehiculos(); track vehiculo.id; let index = $index) {
      <ion-item-sliding>
        <ion-item (click)="validarVehiculo(vehiculo)">
          <ion-label>
            <h2>{{ vehiculo.marca }} {{ vehiculo.modelo }} ({{ vehiculo.anio }})</h2>
            <p>Placa: {{ vehiculo.placa }}</p>
            <p>Kilometraje actual: {{ vehiculo.kilometrajeActual }} km</p>
          </ion-label>
        </ion-item>
        <ion-item-options side="end">
          <ion-item-option color="warning" (click)="editarVehiculo(vehiculo)">
            <ion-icon name="create-outline"></ion-icon>
          </ion-item-option>
          <ion-item-option color="danger" (click)="eliminarVehiculo(vehiculo)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    } @empty {
      <ion-item>
        <ion-label>No hay vehículos disponibles.</ion-label>
      </ion-item>
    }
  </ion-list>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="agregarVehiculo()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
