<ion-item-sliding>
  <ion-item class="vehiculo-item" button detail="false" (click)="verHistorial.emit(vehiculo)">
    <ion-avatar slot="start" class="vehiculo-avatar">
      <ion-icon name="car-sport"></ion-icon>
    </ion-avatar>
    <ion-label>
      <h2>{{ vehiculo.marca }} {{ vehiculo.modelo }}</h2>
      <p>Placa: {{ vehiculo.placa }} &middot; Año {{ vehiculo.anio }}</p>
      <ion-badge color="tertiary">{{ vehiculo.kilometrajeActual }} km</ion-badge>
    </ion-label>
  </ion-item>
  <ion-item-options side="end">
    <ion-item-option color="warning" (click)="editar.emit(vehiculo)">
      <ion-icon slot="icon-only" name="create-outline"></ion-icon>
    </ion-item-option>
    <ion-item-option color="danger" (click)="eliminar.emit(vehiculo)">
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
